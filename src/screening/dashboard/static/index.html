<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screening Dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e3e6eb;
  --text: #16191f; --text-2: #5b6472; --text-3: #8a93a1;
  --accent: #3b5bdb; --accent-soft: #e8edff;
  --ok: #1f8a4c; --ok-soft: #e3f4ea;
  --bad: #c92a2a; --bad-soft: #fdeaea;
  --warn: #b35c00; --warn-soft: #fff1dc;
  --muted: #6b7280; --muted-soft: #eef0f3;
  --pending: #4c6ef5; --pending-soft: #edf1ff;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1e222b; --border: #2a2f3a;
    --text: #e8eaee; --text-2: #a3abb8; --text-3: #737c8a;
    --accent: #7c93ff; --accent-soft: #232b4d;
    --ok: #4cc27f; --ok-soft: #173325;
    --bad: #ff6b6b; --bad-soft: #3a1c1f;
    --warn: #f0a44b; --warn-soft: #3a2a14;
    --muted: #9aa3af; --muted-soft: #252a33;
    --pending: #8ea2ff; --pending-soft: #1f2542;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a21; --surface-2: #1e222b; --border: #2a2f3a;
  --text: #e8eaee; --text-2: #a3abb8; --text-3: #737c8a;
  --accent: #7c93ff; --accent-soft: #232b4d;
  --ok: #4cc27f; --ok-soft: #173325;
  --bad: #ff6b6b; --bad-soft: #3a1c1f;
  --warn: #f0a44b; --warn-soft: #3a2a14;
  --muted: #9aa3af; --muted-soft: #252a33;
  --pending: #8ea2ff; --pending-soft: #1f2542;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 20px 24px 48px; }
@media (max-width: 640px) { .wrap { padding: 14px 16px 40px; } }

/* header */
header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.brand h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.brand .sub { color: var(--text-2); font-size: 13px; }
.spacer { flex: 1; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--text-2); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.chip.mono { font-family: var(--mono); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.live-dot.stale { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }

.banner { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
  display: flex; gap: 10px; align-items: flex-start; }
.banner.demo { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.err { background: var(--bad-soft); color: var(--bad); }
.banner b { font-weight: 650; white-space: nowrap; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
  box-shadow: var(--shadow); cursor: pointer; text-align: left; }
.kpi:hover { border-color: var(--text-3); }
.kpi.active { outline: 2px solid var(--accent); outline-offset: -1px; }
.kpi .label { color: var(--text-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* pipeline strip */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.pipeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-bottom: 16px; }
@media (max-width: 800px) { .pipeline { grid-template-columns: 1fr; } }
.pstage { padding: 14px 16px; border-right: 1px solid var(--border); min-width: 0; }
.pstage:last-child { border-right: 0; }
@media (max-width: 800px) { .pstage { border-right: 0; border-bottom: 1px solid var(--border); } .pstage:last-child { border-bottom: 0; } }
.pstage .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pstage .t b { font-size: 13px; }
.pstage .t span { color: var(--text-3); font-size: 12px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin: 10px 0 8px; gap: 2px; }
.bar > i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.stagenote { margin-top: 8px; font-size: 12px; color: var(--text-2); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tab { background: none; border: 0; padding: 8px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent;
  margin-bottom: -1px; white-space: nowrap; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count { font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 1px 7px; margin-left: 6px; color: var(--text-2); }

/* candidates split view */
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
.toolbar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.search { flex: 1; min-width: 160px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.filter { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.filter.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 550; font-size: 12px; color: var(--text-2); padding: 8px 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.sel td { background: var(--accent-soft); }
.name { font-weight: 600; }
.file { color: var(--text-3); font-size: 12px; font-family: var(--mono); }
.empty { padding: 36px 16px; text-align: center; color: var(--text-2); }
.empty code { font-family: var(--mono); background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px;
  font-weight: 550; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-success, .s-completed, .s-shortlisted { color: var(--ok); background: var(--ok-soft); }
.s-failed, .s-rejected { color: var(--bad); background: var(--bad-soft); }
.s-awaiting { color: var(--warn); background: var(--warn-soft); }
.s-skipped { color: var(--muted); background: var(--muted-soft); }
.s-pending, .s-active { color: var(--pending); background: var(--pending-soft); }
.dots { display: inline-flex; gap: 4px; }
.dot { width: 22px; height: 6px; border-radius: 3px; }
.dot.success { background: var(--ok); } .dot.failed { background: var(--bad); } .dot.awaiting { background: var(--warn); }
.dot.skipped { background: var(--muted-soft); border: 1px solid var(--border); } .dot.pending { background: var(--pending-soft); border: 1px dashed var(--pending); }

.score { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.score .track { position: relative; flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; }
.score .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.score .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; border-radius: 1px; }
.score .num { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 42px; text-align: right; }

/* detail */
.detail { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
@media (max-width: 1100px) { .detail { position: static; max-height: none; } }
.dhead { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.dhead h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.idline { font-family: var(--mono); font-size: 12px; color: var(--text-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
.section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: 0; }
.section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 0 0 10px; font-weight: 600;
  display: flex; align-items: center; gap: 8px; }
.timeline { display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 110px auto 1fr; gap: 10px; align-items: start; font-size: 13px; }
.step .sname { color: var(--text-2); }
.step .snote { color: var(--text-2); font-size: 12px; word-break: break-word; }
.step .snote.err { color: var(--bad); font-family: var(--mono); }
@media (max-width: 520px) { .step { grid-template-columns: 1fr; gap: 2px; } }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; word-break: break-word; }
@media (max-width: 520px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; } }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); }
.tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.job { margin-bottom: 10px; }
.job .jt { font-weight: 600; }
.job .jm { color: var(--text-2); font-size: 12px; }
.job ul { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13px; }
.crit { display: grid; grid-template-columns: 150px 1fr 44px; gap: 10px; align-items: center; margin-bottom: 4px; font-size: 13px; }
.crit .w { color: var(--text-3); font-size: 11px; }
.crit .ev { grid-column: 1 / -1; color: var(--text-2); font-size: 12px; margin: -2px 0 8px; }
.crit .track { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; }
.crit .track i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.crit .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
@media (max-width: 520px) { .crit { grid-template-columns: 1fr 44px; } .crit .track { grid-column: 1 / -1; grid-row: 2; } }
.verdict { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 8px; background: var(--surface-2); margin-bottom: 12px; flex-wrap: wrap; }
.verdict .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.verdict .of { color: var(--text-2); font-size: 12px; }
.prose { font-size: 13px; color: var(--text); margin: 8px 0 0; }
.muted { color: var(--text-2); }
.small { font-size: 12px; }
.answers { display: grid; gap: 8px; }
.ans { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; }
.ans .q { color: var(--text-2); font-size: 12px; }
.ans .mark { font-weight: 700; }
.ans .mark.y { color: var(--ok); } .ans .mark.n { color: var(--text-3); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
@media (max-width: 520px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fact { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.fact .l { font-size: 11px; color: var(--text-2); }
.fact .v { font-weight: 600; font-size: 14px; word-break: break-word; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
pre.transcript, pre.log { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; background: var(--surface-2);
  border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; max-height: 360px; overflow: auto; }
pre.log { max-height: 70vh; margin: 0; border-radius: 0 0 var(--radius) var(--radius); }
.log .ERROR { color: var(--bad); } .log .WARNING { color: var(--warn); } .log .DEBUG { color: var(--text-3); }
.invitebox { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.blockbox { border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.placeholder { padding: 48px 20px; text-align: center; color: var(--text-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Screening Dashboard</h1>
      <div class="sub" id="jobline">Loading…</div>
    </div>
    <div class="spacer"></div>
    <div class="meta">
      <span class="chip" title="Auto-refreshes every 5 seconds"><span class="live-dot" id="livedot"></span><span id="updated">—</span></span>
      <span class="chip mono" id="llmchip" title="LLM configured in config/settings.yaml (each record shows the model that actually produced it)">—</span>
      <span class="chip mono" id="datachip" title="Data directory">—</span>
      <button class="iconbtn" id="theme" title="Toggle light/dark">◐</button>
    </div>
  </header>

  <div id="banners"></div>

  <section class="kpis" id="kpis"></section>
  <section class="card pipeline" id="pipeline"></section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="candidates">Candidates</button>
    <button class="tab" data-tab="failures">Failures<span class="count" id="failcount">0</span></button>
    <button class="tab" data-tab="log">Pipeline log</button>
    <button class="tab" data-tab="config">Job &amp; thresholds</button>
  </nav>

  <section id="tab-candidates">
    <div class="split">
      <div class="card">
        <div class="toolbar">
          <input class="search" id="search" type="search" placeholder="Search name, file or candidate_id…" aria-label="Search candidates">
          <div id="filters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        </div>
        <div class="tablewrap"><table>
          <thead><tr><th>Candidate</th><th>Status</th><th title="Stage 1 · Stage 2 · Stage 3">Stages</th><th>Score</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <div id="norows" class="empty hidden"></div>
      </div>
      <aside class="card detail" id="detail"><div class="placeholder">Select a candidate to see their profile, shortlisting breakdown and screening-call result.</div></aside>
    </div>
  </section>

  <section id="tab-failures" class="hidden">
    <div class="card"><div class="tablewrap"><table>
      <thead><tr><th>When (UTC)</th><th>Stage</th><th>Candidate</th><th>Error</th></tr></thead>
      <tbody id="failrows"></tbody>
    </table></div><div id="nofail" class="empty hidden">No failures recorded. 🎉</div></div>
  </section>

  <section id="tab-log" class="hidden">
    <div class="card">
      <div class="toolbar"><span class="muted small">Last 400 lines of <code id="logpath">logs/pipeline.log</code> · newest at the bottom</span></div>
      <pre class="log" id="log"></pre>
    </div>
  </section>

  <section id="tab-config" class="hidden"><div class="grid2" id="configview"></div></section>
</div>

<script>
"use strict";
// ---------- tiny safe DOM builder: all data is inserted as text, never as HTML ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = (id) => document.getElementById(id);
const STAGE_LABEL = { stage1_extraction: "1 · Extraction", stage2_shortlisting: "2 · Shortlisting", stage3_calling: "3 · Screening call" };
const STATUS_ORDER = ["success", "failed", "awaiting", "skipped", "pending"];
const STATUS_COLOR = { success: "var(--ok)", failed: "var(--bad)", awaiting: "var(--warn)", skipped: "var(--text-3)", pending: "var(--pending)" };
const pill = (s, label) => h("span", { class: `pill s-${s}` }, label || s);
const fmtTime = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(); };
const fileName = (p) => (p || "").split("/").pop();
const val = (v, fallback = "—") => (v === null || v === undefined || v === "" ? fallback : v);

const state = { ov: null, sig: null, selected: null, filter: "all", q: "", tab: "candidates", detailCache: {} };

// ---------- theme ----------
(function initTheme() {
  let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("theme").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
  };
})();

// ---------- data ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}

function candidates() {
  return Object.values(state.ov?.index?.candidates || {})
    .sort((a, b) => (a.ingested_at || "").localeCompare(b.ingested_at || "") || a.source_file.localeCompare(b.source_file));
}

function bucket(c) {
  const s2 = c.stages.stage2_shortlisting;
  return {
    shortlisted: s2.decision === "shortlisted",
    rejected: s2.decision === "rejected",
    failed: c.overall_status === "failed",
    awaiting: c.stages.stage3_calling.status === "awaiting",
    completed: c.overall_status === "completed",
  };
}

async function refresh() {
  try {
    const ov = await getJSON("/api/overview");
    $("livedot").classList.remove("stale");
    const sig = JSON.stringify([ov.index.updated_at, ov.failure_count, ov.demo, ov.job_error, ov.llm_error]);
    state.ov = ov;
    $("updated").textContent = ov.index.updated_at ? "Updated " + fmtTime(ov.index.updated_at) : "No runs yet";
    if (sig !== state.sig) {
      state.sig = sig; state.detailCache = {};
      renderAll();
    }
    if (state.tab === "log") loadLog();
  } catch (e) {
    $("livedot").classList.add("stale");
    $("updated").textContent = "Dashboard server unreachable";
  }
}

// ---------- render ----------
function renderAll() {
  const ov = state.ov;
  const job = ov.job;
  $("jobline").textContent = job ? `${job.title} · ${job.company_name} · job_id ${job.job_id}` : "Job description could not be loaded";
  $("llmchip").textContent = `configured: ${ov.llm.provider} / ${ov.llm.model}`;
  $("datachip").textContent = ov.data_dir.split("/").slice(-2).join("/");
  $("datachip").title = "Data directory: " + ov.data_dir;
  $("logpath").textContent = ov.data_dir + "/logs/pipeline.log";

  const banners = $("banners"); banners.replaceChildren();
  if (ov.demo) banners.append(h("div", { class: "banner demo" }, h("b", {}, "DEMO DATA"),
    h("span", {}, "These results were produced from the synthetic sample resumes with a fake LLM, not Gemini. Scores and transcript parsing are illustrative only. Run without --data-dir to see your real data/.")));
  if (ov.llm_error) banners.append(h("div", { class: "banner err" }, h("b", {}, "Interviews can't start"),
    h("span", {}, "No Gemini API key is configured, so candidates see “We couldn't start the call”. Copy .env.example to .env in the project folder and set GEMINI_API_KEY (free key: aistudio.google.com/apikey). No restart needed.")));
  if (ov.job_error) banners.append(h("div", { class: "banner err" }, h("b", {}, "Config error"), h("span", {}, ov.job_error)));

  renderKPIs(); renderPipeline(); renderFilters(); renderRows(); renderFailures(); renderConfig();
  if (state.selected && !(ov.index.candidates || {})[state.selected]) {  // candidate vanished (e.g. data dir rebuilt)
    state.selected = null;
    $("detail").replaceChildren(h("div", { class: "placeholder" }, "Select a candidate to see their profile, shortlisting breakdown and screening-call result."));
  }
  if (state.selected) selectCandidate(state.selected, { keepScroll: true });
}

function renderKPIs() {
  const cs = candidates(); const b = cs.map(bucket);
  const n = (k) => b.filter((x) => x[k]).length;
  const items = [
    ["all", "Candidates", cs.length, "var(--text-3)"],
    ["shortlisted", "Shortlisted", n("shortlisted"), "var(--ok)"],
    ["rejected", "Rejected", n("rejected"), "var(--bad)"],
    ["awaiting", "Awaiting candidate", n("awaiting"), "var(--warn)"],
    ["completed", "Calls parsed", n("completed"), "var(--accent)"],
    ["failed", "Failed", n("failed"), "var(--bad)"],
  ];
  $("kpis").replaceChildren(...items.map(([key, label, value, color]) =>
    h("button", { class: "kpi" + (state.filter === key ? " active" : ""), onclick: () => setFilter(key), title: "Filter the table" },
      h("div", { class: "label" }, h("i", { class: "sw", style: `background:${color}` }), label),
      h("div", { class: "value" }, value))));
}

function renderPipeline() {
  const cs = candidates(); const total = cs.length || 1;
  $("pipeline").replaceChildren(...state.ov.stages.map((stage) => {
    const counts = Object.fromEntries(STATUS_ORDER.map((s) => [s, 0]));
    cs.forEach((c) => counts[c.stages[stage].status]++);
    const extra = [];
    if (stage === "stage2_shortlisting") {
      const sl = cs.filter((c) => c.stages[stage].decision === "shortlisted").length;
      const rj = cs.filter((c) => c.stages[stage].decision === "rejected").length;
      extra.push(h("div", { class: "legend", style: "margin-top:6px" },
        h("span", {}, h("i", { class: "sw", style: "background:var(--ok)" }), `${sl} shortlisted`),
        h("span", {}, h("i", { class: "sw", style: "background:var(--bad)" }), `${rj} rejected`)));
    }
    if (stage === "stage3_calling" && counts.awaiting)
      extra.push(h("div", { class: "stagenote" }, `${counts.awaiting} interview link${counts.awaiting > 1 ? "s" : ""} waiting for the candidate.`));
    return h("div", { class: "pstage" },
      h("div", { class: "t" }, h("b", {}, STAGE_LABEL[stage]), h("span", {}, `${counts.success}/${cs.length} done`)),
      h("div", { class: "bar", role: "img", "aria-label": STATUS_ORDER.map((s) => `${counts[s]} ${s}`).join(", ") },
        STATUS_ORDER.filter((s) => counts[s]).map((s) =>
          h("i", { style: `width:${(counts[s] / total) * 100}%;background:${STATUS_COLOR[s]}`, title: `${counts[s]} ${s}` }))),
      h("div", { class: "legend" }, STATUS_ORDER.filter((s) => counts[s]).map((s) =>
        h("span", {}, h("i", { class: "sw", style: `background:${STATUS_COLOR[s]}` }), `${counts[s]} ${s}`))),
      extra);
  }));
}

const FILTERS = [["all", "All"], ["shortlisted", "Shortlisted"], ["rejected", "Rejected"], ["awaiting", "Awaiting candidate"], ["completed", "Call parsed"], ["failed", "Failed"]];
function setFilter(f) { state.filter = f; renderKPIs(); renderFilters(); renderRows(); }
function renderFilters() {
  $("filters").replaceChildren(...FILTERS.map(([k, l]) =>
    h("button", { class: "filter" + (state.filter === k ? " active" : ""), onclick: () => setFilter(k) }, l)));
}

function scoreCell(c) {
  const s2 = c.stages.stage2_shortlisting;
  if (s2.score == null) return h("span", { class: "muted small" }, "—");
  const th = state.ov.thresholds.shortlist_score;
  const color = s2.decision === "shortlisted" ? "var(--ok)" : "var(--bad)";
  return h("div", { class: "score", title: `Score ${s2.score} · threshold ${th}` },
    h("div", { class: "track" }, h("div", { class: "fill", style: `width:${Math.min(100, s2.score)}%;background:${color}` }),
      h("div", { class: "tick", style: `left:calc(${th}% - 1px)` })),
    h("span", { class: "num" }, s2.score.toFixed(1)));
}

function renderRows() {
  const q = state.q.trim().toLowerCase();
  const rows = candidates().filter((c) => {
    if (state.filter !== "all" && !bucket(c)[state.filter]) return false;
    if (!q) return true;
    return [c.display_name, c.source_file, c.candidate_id].some((x) => (x || "").toLowerCase().includes(q));
  });
  $("rows").replaceChildren(...rows.map((c) => {
    const overall = c.stages.stage2_shortlisting.decision === "rejected" ? "rejected" : c.overall_status;
    return h("tr", { class: c.candidate_id === state.selected ? "sel" : "", onclick: () => selectCandidate(c.candidate_id), tabindex: "0",
        onkeydown: (e) => { if (e.key === "Enter") selectCandidate(c.candidate_id); } },
      h("td", {}, h("div", { class: "name" }, c.display_name || fileName(c.source_file)), h("div", { class: "file" }, fileName(c.source_file))),
      h("td", {}, pill(overall)),
      h("td", {}, h("span", { class: "dots" }, state.ov.stages.map((s) =>
        h("i", { class: "dot " + c.stages[s].status, title: `${STAGE_LABEL[s]}: ${c.stages[s].status}${c.stages[s].error ? " — " + c.stages[s].error : c.stages[s].note ? " — " + c.stages[s].note : ""}` })))),
      h("td", {}, scoreCell(c)));
  }));
  const none = $("norows");
  if (!candidates().length) {
    none.replaceChildren(h("div", {}, "No candidates yet."), h("div", { class: "small", style: "margin-top:6px" },
      "Put .docx resumes in ", h("code", {}, "data/input/resumes/"), " and run ", h("code", {}, "uv run screening run"), "."));
    none.classList.remove("hidden");
  } else if (!rows.length) {
    none.replaceChildren("No candidates match this filter."); none.classList.remove("hidden");
  } else none.classList.add("hidden");
}

// ---------- detail ----------
async function selectCandidate(cid, opts = {}) {
  state.selected = cid;
  document.querySelectorAll("#rows tr").forEach((tr) => tr.classList.remove("sel"));
  renderRows();
  let d = state.detailCache[cid];
  if (!d) {
    try { d = state.detailCache[cid] = await getJSON("/api/candidate/" + cid); }
    catch (e) { $("detail").replaceChildren(h("div", { class: "placeholder" }, "Could not load candidate: " + e.message)); return; }
  }
  if (state.selected !== cid) return;
  const scroll = $("detail").scrollTop;
  $("detail").replaceChildren(...renderDetail(d));
  if (opts.keepScroll) $("detail").scrollTop = scroll;
  else if (matchMedia("(max-width: 1100px)").matches) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

function callLine(c) {
  const ch = { browser_voice: "Browser voice call", browser_text: "Browser text chat", terminal_simulation: "Terminal simulation",
               local_transcript_file: "Parsed from a local transcript file" }[c.channel] || c.channel;
  const parts = [ch, `outcome: ${c.status}`];
  if (c.duration_seconds != null) parts.push(`${Math.floor(c.duration_seconds / 60)}m ${Math.round(c.duration_seconds % 60)}s`);
  if (c.candidate_turns) parts.push(`${c.candidate_turns} candidate turns`);
  if (c.agent_llm) parts.push(`agent: ${c.agent_llm}`);
  return parts.join(" · ");
}

function copyBtn(text) {
  return h("button", { class: "copy", onclick: (e) => { e.stopPropagation(); navigator.clipboard?.writeText(text); e.target.textContent = "copied"; setTimeout(() => (e.target.textContent = "copy"), 1200); } }, "copy");
}

function renderDetail(d) {
  const { entry: c, records: r } = d;
  const s1 = r.stage1_extraction, s2 = r.stage2_shortlisting, s3 = r.stage3_calling;
  const overall = c.stages.stage2_shortlisting.decision === "rejected" ? "rejected" : c.overall_status;
  const out = [];
  out.push(h("div", { class: "dhead" },
    h("h2", {}, c.display_name || fileName(c.source_file), pill(overall)),
    h("div", { class: "idline" }, "candidate_id ", c.candidate_id, copyBtn(c.candidate_id)),
    h("div", { class: "idline" }, c.source_file)));

  // pipeline timeline
  out.push(h("div", { class: "section" }, h("h3", {}, "Pipeline"),
    h("div", { class: "timeline" }, state.ov.stages.map((s) => {
      const st = c.stages[s];
      const note = st.error || st.note || (st.updated_at ? fmtTime(st.updated_at) : "");
      return h("div", { class: "step" }, h("span", { class: "sname" }, STAGE_LABEL[s]), pill(st.status),
        h("span", { class: "snote" + (st.error ? " err" : "") }, note));
    }))));

  // profile
  if (s1) {
    const x = s1.extraction;
    out.push(h("div", { class: "section" }, h("h3", {}, "Profile (Stage 1)", h("span", { class: "muted small", style: "text-transform:none;letter-spacing:0" }, `· ${s1.llm?.model || ""}`)),
      x.summary ? h("p", { class: "prose", style: "margin:0 0 12px" }, x.summary) : null,
      h("dl", { class: "kv" },
        h("dt", {}, "Headline"), h("dd", {}, val(x.headline)),
        h("dt", {}, "Current role"), h("dd", {}, [x.current_title, x.current_company].filter(Boolean).join(" at ") || "—"),
        h("dt", {}, "Experience"), h("dd", {}, x.total_experience_years != null ? `${x.total_experience_years} years` : "—"),
        h("dt", {}, "Email"), h("dd", {}, val(x.email)),
        h("dt", {}, "Phone"), h("dd", {}, val(x.phone, "— (Stage 3 will skip)")),
        h("dt", {}, "Location"), h("dd", {}, val(x.location)),
        x.linkedin_url ? [h("dt", {}, "LinkedIn"), h("dd", {}, x.linkedin_url)] : null,
        h("dt", {}, "Education"), h("dd", {}, x.education.length ? x.education.map((e) =>
          h("div", {}, [e.degree, e.field_of_study].filter(Boolean).join(", "), e.institution ? ` — ${e.institution}` : "", e.graduation_year ? ` (${e.graduation_year})` : "")) : "—"),
        x.certifications.length ? [h("dt", {}, "Certifications"), h("dd", {}, x.certifications.join("; "))] : null,
        x.languages.length ? [h("dt", {}, "Languages"), h("dd", {}, x.languages.join(", "))] : null),
      h("div", { style: "margin-top:12px" }, h("div", { class: "muted small", style: "margin-bottom:6px" }, `Skills (${x.skills.length})`),
        h("div", { class: "tags" }, x.skills.map((s) => h("span", { class: "tag" }, s)))),
      x.work_experience.length ? h("div", { style: "margin-top:14px" }, h("div", { class: "muted small", style: "margin-bottom:6px" }, "Work experience"),
        x.work_experience.map((w) => h("div", { class: "job" },
          h("div", { class: "jt" }, [w.title, w.company].filter(Boolean).join(" — ")),
          h("div", { class: "jm" }, `${val(w.start_date, "?")} → ${w.is_current ? "Present" : val(w.end_date, "?")}${w.location ? " · " + w.location : ""}`),
          w.highlights.length ? h("ul", {}, w.highlights.map((b) => h("li", {}, b))) : null))) : null,
      s1.truncated ? h("div", { class: "small", style: "color:var(--warn);margin-top:8px" }, "Resume text was truncated before extraction.") : null));
  }

  // shortlisting
  if (s2) {
    out.push(h("div", { class: "section" }, h("h3", {}, "Shortlisting (Stage 2)"),
      h("div", { class: "verdict" },
        h("div", {}, h("div", { class: "big" }, s2.overall_score.toFixed(2)), h("div", { class: "of" }, `weighted score · threshold ${s2.threshold}`)),
        pill(s2.decision),
        h("div", { class: "small muted", style: "flex:1;min-width:180px" }, s2.decision_reasons.join(" · "))),
      s2.criteria.map((k) => h("div", { class: "crit" },
        h("div", {}, k.criterion.replaceAll("_", " "), h("div", { class: "w" }, `weight ${Math.round(k.weight * 100)}% · adds ${k.weighted_score}`)),
        h("div", { class: "track" }, h("i", { style: `width:${k.score}%` })),
        h("div", { class: "n" }, k.score),
        h("div", { class: "ev" }, k.evidence))),
      h("div", { style: "margin-top:10px", class: "tags" },
        s2.matched_must_have_skills.map((s) => h("span", { class: "tag ok", title: "Must-have: evidenced" }, "✓ " + s)),
        s2.missing_must_have_skills.map((s) => h("span", { class: "tag bad", title: "Must-have: missing" }, "✗ " + s)),
        s2.matched_nice_to_have_skills.map((s) => h("span", { class: "tag", title: "Nice-to-have: evidenced" }, "+ " + s))),
      h("p", { class: "prose" }, s2.rationale),
      h("div", { class: "small muted", style: "margin-top:6px" }, `Scored by ${s2.llm?.model || "?"} · ${fmtTime(s2.created_at)} · name, contact and location hidden from the scorer`)));
  }

  // screening call
  const st3 = c.stages.stage3_calling;
  if (s3) {
    const sc = s3.screening;
    const yn = (v) => (v === true ? "Yes" : v === false ? "No" : "—");
    out.push(h("div", { class: "section" }, h("h3", {}, "Screening call (Stage 3)", pill(sc.sentiment)),
      h("div", { class: "small muted", style: "margin-bottom:10px" }, callLine(s3.call)),
      h("div", { class: "facts" },
        [["Interested", yn(sc.interested_in_role)], ["Notice period", sc.notice_period_days != null ? `${sc.notice_period_days} days` : "—"],
         ["Relocate / hybrid", yn(sc.willing_to_relocate)], ["Current CTC", val(sc.current_ctc)], ["Expected CTC", val(sc.expected_ctc)],
         ["Location", val(sc.current_location)]].map(([l, v]) => h("div", { class: "fact" }, h("div", { class: "l" }, l), h("div", { class: "v" }, v)))),
      h("dl", { class: "kv", style: "margin-bottom:12px" }, h("dt", {}, "Interview availability"), h("dd", {}, val(sc.available_for_interview))),
      h("div", { class: "answers" }, sc.answers.map((a) => h("div", { class: "ans" },
        h("span", { class: "mark " + (a.answered ? "y" : "n") }, a.answered ? "✓" : "–"),
        h("div", {}, h("div", { class: "q" }, a.question), h("div", {}, a.answered ? a.answer_summary : h("span", { class: "muted" }, "Not answered")))))),
      sc.candidate_questions.length ? h("div", { style: "margin-top:12px" }, h("div", { class: "muted small" }, "Candidate asked"), h("ul", { style: "margin:4px 0 0;padding-left:18px" }, sc.candidate_questions.map((q) => h("li", {}, q)))) : null,
      sc.red_flags.length ? h("div", { style: "margin-top:12px" }, h("div", { class: "small", style: "color:var(--bad)" }, "Red flags"), h("ul", { style: "margin:4px 0 0;padding-left:18px" }, sc.red_flags.map((q) => h("li", {}, q)))) : null,
      h("p", { class: "prose" }, sc.overall_summary),
      d.transcript ? h("details", { style: "margin-top:10px" }, h("summary", {}, "Transcript"), h("pre", { class: "transcript" }, d.transcript)) : null));
  }
  if (st3.status === "awaiting" || d.invite) {
    const inv = d.invite;
    out.push(h("div", { class: "section" }, h("h3", {}, s3 ? "Interview link (another attempt)" : "Screening call (Stage 3)"),
      inv ? h("div", { class: "invitebox" },
        h("div", { style: "margin-bottom:8px" }, s3 ? `Last call: ${s3.call.status}${s3.call.reschedule_note ? " (" + s3.call.reschedule_note + ")" : ""}. The link below still works.`
                                                  : "Shortlisted: waiting for the candidate to open their interview link."),
        h("div", { style: "font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--text)" }, inv.url),
        h("div", { style: "margin-top:8px;display:flex;gap:8px;flex-wrap:wrap" },
          h("button", { class: "iconbtn", onclick: (e) => { navigator.clipboard?.writeText(inv.url); e.target.textContent = "Copied"; setTimeout(() => (e.target.textContent = "Copy link"), 1200); } }, "Copy link"),
          h("a", { class: "iconbtn", href: inv.url, target: "_blank", rel: "noopener noreferrer", style: "text-decoration:none;color:inherit" }, "Open interview ↗")),
        h("div", { class: "small", style: "margin-top:8px;color:var(--text-2)" }, `Expires ${fmtTime(inv.expires_at)} · ${inv.sessions} attempt${inv.sessions === 1 ? "" : "s"} so far. Share it only with this candidate.`))
      : h("div", { class: "small muted" }, st3.note || "No active link. Run `uv run screening call` to issue one.")));
  }

  if (d.failures.length) {
    out.push(h("div", { class: "section" }, h("h3", {}, `Failure history (${d.failures.length})`),
      d.failures.map((f) => h("div", { class: "small", style: "margin-bottom:8px" },
        h("div", { class: "muted" }, `${fmtTime(f.ts)} · ${STAGE_LABEL[f.stage] || f.stage} · run ${String(f.run_id).slice(0, 8)}`),
        h("div", { style: "font-family:var(--mono);color:var(--bad);word-break:break-word" }, `${f.error_type}: ${f.error}`)))));
  }
  return out;
}

// ---------- failures / log / config ----------
async function renderFailures() {
  $("failcount").textContent = state.ov.failure_count;
  const list = await getJSON("/api/failures").catch(() => []);
  const byId = state.ov.index.candidates || {};
  $("failrows").replaceChildren(...list.map((f) => h("tr", { onclick: () => { if (byId[f.candidate_id]) { switchTab("candidates"); selectCandidate(f.candidate_id); } } },
    h("td", { class: "small", style: "white-space:nowrap" }, fmtTime(f.ts)),
    h("td", {}, STAGE_LABEL[f.stage] || f.stage),
    h("td", {}, h("div", { class: "name" }, byId[f.candidate_id]?.display_name || fileName(f.source_file)), h("div", { class: "file" }, f.candidate_id)),
    h("td", { style: "font-family:var(--mono);font-size:12px;color:var(--bad);word-break:break-word" }, `${f.error_type}: ${f.error}`))));
  $("nofail").classList.toggle("hidden", list.length > 0);
}

async function loadLog() {
  const { log } = await getJSON("/api/log?lines=400").catch(() => ({ log: "(could not load log)" }));
  const pre = $("log");
  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
  pre.replaceChildren(...(log || "(empty)").split("\n").map((line) => {
    const lvl = (line.match(/ (ERROR|WARNING|INFO|DEBUG) /) || [])[1] || "";
    return h("span", { class: lvl }, line + "\n");
  }));
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

function renderConfig() {
  const { job, thresholds: t, weights: w, llm } = state.ov;
  const jobCard = job ? h("div", { class: "card" },
    h("div", { class: "section" }, h("h3", {}, "Job description"),
      h("div", { style: "font-weight:600;font-size:15px" }, job.title),
      h("div", { class: "muted small", style: "margin-bottom:10px" }, `${job.company_name} · ${val(job.location)} · ${job.job_id}`),
      h("dl", { class: "kv" }, h("dt", {}, "Experience"), h("dd", {}, `${val(job.min_experience_years, "?")}–${val(job.max_experience_years, "?")} years`)),
      h("div", { style: "margin-top:10px" }, h("div", { class: "muted small", style: "margin-bottom:6px" }, "Must-have"), h("div", { class: "tags" }, job.must_have_skills.map((s) => h("span", { class: "tag ok" }, s)))),
      h("div", { style: "margin-top:10px" }, h("div", { class: "muted small", style: "margin-bottom:6px" }, "Nice-to-have"), h("div", { class: "tags" }, job.nice_to_have_skills.map((s) => h("span", { class: "tag" }, s)))),
      h("pre", { class: "transcript", style: "font-family:inherit;font-size:13px" }, job.description))) : h("div", { class: "card placeholder" }, "Job description unavailable");
  const th = h("div", { class: "card" },
    h("div", { class: "section" }, h("h3", {}, "Decision rule"),
      h("dl", { class: "kv" },
        h("dt", {}, "Shortlist if score ≥"), h("dd", {}, h("b", {}, t.shortlist_score)),
        h("dt", {}, "Require all must-haves"), h("dd", {}, t.require_all_must_have ? "Yes" : "No"),
        h("dt", {}, "Min resume text"), h("dd", {}, `${t.min_resume_chars} chars`),
        h("dt", {}, "Max resume text"), h("dd", {}, `${t.max_resume_chars} chars (truncated beyond)`),
        h("dt", {}, "LLM"), h("dd", {}, `${llm.provider} / ${llm.model}`))),
    h("div", { class: "section" }, h("h3", {}, "Criterion weights"),
      Object.entries(w).map(([k, v]) => h("div", { class: "crit" }, h("div", {}, k.replaceAll("_", " ")),
        h("div", { class: "track" }, h("i", { style: `width:${v * 100}%` })), h("div", { class: "n" }, `${Math.round(v * 100)}%`)))),
    h("div", { class: "section small muted" }, "Edit in config/settings.yaml and config/job_description.yaml, then re-run shortlisting with --force."));
  $("configview").replaceChildren(jobCard, th);
}

// ---------- tabs / events ----------
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  ["candidates", "failures", "log", "config"].forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== tab));
  if (tab === "log") loadLog();
}
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => switchTab(b.dataset.tab)));
$("search").addEventListener("input", (e) => { state.q = e.target.value; renderRows(); });

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
