# Pipeline settings. Paths are relative to the data directory
# (default: <project>/data, override with --data-dir).

paths:
  input_resumes: input/resumes
  candidates_index: candidates_index.json
  stage1_output: stage1_extracted
  stage2_output: stage2_shortlist
  stage3_output: stage3_calls
  stage3_transcripts: stage3_calls/transcripts
  stage3_sessions: stage3_calls/sessions
  stage3_invites: stage3_calls/invites.json
  logs: logs

files:
  job_description: config/job_description.yaml       # relative to project root
  screening_questions: config/screening_questions.yaml

thresholds:
  min_resume_chars: 200       # below this, Stage 1 fails (empty / scanned resume)
  max_resume_chars: 60000     # longer text is truncated (WARNING logged)
  shortlist_score: 70         # overall_score >= this => shortlisted
  require_all_must_have: false  # true => any missing must-have skill => rejected

scoring:
  # Weights applied in code to the LLM's per-criterion scores (0-100). Must sum to 1.0.
  weights:
    must_have_skills: 0.40
    experience: 0.30
    nice_to_have_skills: 0.15
    role_relevance: 0.15

llm:
  provider: gemini
  model: gemini-3-flash-preview   # free tier: ~20 requests/day per model
  fallback_models:                # tried in order if the model above fails (each has its own free quota)
    - gemini-3.1-flash-lite
    - gemini-3.5-flash
    - gemini-3.8-flash
  temperature: 0.0
  timeout_seconds: 120
  transient_retry_delays: [2, 5]  # retry only Gemini 429 (rate limit) / 503 (overloaded), after these waits
  api_key_env: GEMINI_API_KEY

stage3:
  # In-house screening agent (browser voice / text). Links look like <public_base_url>/interview/<token>.
  # Mic access needs a secure origin: localhost works; for other machines use an HTTPS URL (e.g. a tunnel).
  public_base_url: http://127.0.0.1:8765
  invite_ttl_days: 3              # the link in the invite email stops working after this
  max_followups_per_question: 1   # agent may ask at most this many clarifying follow-ups per question
  max_candidate_turns: 40         # hard stop for runaway conversations
  max_turn_chars: 2000            # longer candidate messages are truncated
  speech_lang: en-IN              # speech recognition + voice language (e.g. en-US, en-GB)
  agent_temperature: 0.4          # a little variety in the spoken replies (parsing stays at llm.temperature)
  support_phone: "+1 (463) 215-0098"   # in every screening email: "website down? call us"
  email_on_interrupted_call: true   # a call that stops partway emails the candidate the link to finish it
  interrupted_grace_seconds: 45     # ...after this long (a quick page reload does not count)
  max_interrupted_emails: 3
  idle_minutes: 10                  # no activity this long = the call dropped
  verify_email: false             # true = candidate must enter a code emailed to their resume address before the call
  otp_length: 6
  otp_expiry_minutes: 10
  otp_max_attempts: 5
  otp_resend_seconds: 30

evaluation:
  # Stage 4: the LLM scores the interview (0-100 per competency, backed by quotes that code checks
  # against the transcript); code applies these weights and suggests a final decision for people to approve.
  resume_weight: 0.4              # final_score = resume_score x resume_weight + interview_score x interview_weight
  interview_weight: 0.6
  final_threshold: 65             # final_score >= this => suggested "shortlisted"
  competency_weights:             # must sum to 1.0
    role_knowledge: 0.35
    problem_solving: 0.25
    communication: 0.20
    motivation: 0.20
  min_verified_quotes: 1          # a scored competency with fewer verified quotes is flagged "needs review"

credibility:
  # Resume checks + LinkedIn cross-check. Red issues = "Fraud detected": the candidate is stopped before
  # scoring, invite, interview and approvals until a recruiter clears it (name + reason are recorded).
  block_on_fraud: true
  min_red_to_block: 1             # red issues needed to stop a candidate

approvals:
  # The AI suggests; people decide. Nothing is emailed about a decision until a person approved it.
  require_shortlist_approval: true   # interview links go out only after a recruiter approves the resume shortlist
  email_resume_rejections: true      # candidates rejected at the resume stage get a polite email

email:
  # smtp:   send for real via SMTP_* in .env (Gmail: SMTP_USER = your address, SMTP_PASS = 16-char app password)
  # outbox: write every email to <data>/outbox/*.eml instead of sending (dry run). Override with --email.
  mode: smtp
  from_name: Talent Team
  send_invites: true              # `screening call` emails each new interview link (QR code + button)
  reminder_after_hours: 24        # remind candidates who haven't started their call...
  max_reminders: 1                # ...at most this many times
  auto_reminders: true            # `screening serve` checks for due reminders every 10 minutes

storage:
  # mongodb (default): candidates, stage records, transcripts, invites and failures live in MongoDB
  #                    (MONGODB_URI / MONGODB_DB_NAME in .env). Resume files stay in paths.input_resumes.
  # file:              the JSON files described under `paths` (used by tests and the offline demo).
  # Override per command with --storage, or with the STORAGE_BACKEND env var.
  backend: mongodb

logging:
  console_level: INFO
  file_level: DEBUG
